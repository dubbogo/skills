# SPDX-License-Identifier: Apache-2.0
name: Validate skills
on:
  push:
  pull_request:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -X utf8 -m ruff check scripts tests
      - run: python -X utf8 -m ruff format --check scripts tests
      - run: python -X utf8 scripts/validate.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 -m scripts.package --output-dir dist
      - name: Check pull request diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Check pushed diff whitespace
        if: github.event_name == 'push'
        run: git diff-tree -m --check --root -r HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist
          if-no-files-found: error
          retention-days: 7
